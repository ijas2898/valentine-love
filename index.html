<!DOCTYPE html>
<html>

<head>
    <title>For My Love ❤️</title>
    <style>
        body {
            text-align: center;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            color: white;
            padding-top: 100px;
        }

        h1 {
            font-size: 40px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            background: white;
            color: #ff4b6e;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
        }

        #message {
            display: none;
            font-size: 22px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>Happy Valentine's Day My Love 💖</h1>
    <p>You are my today and all of my tomorrows ❤️</p>

    <button onclick="showLove()">Click Here ❤️</button>

    <div id="message">
        <p>I Love You Forever 😘</p>
        <p>You are my Queen 👑</p>
    </div>

    <script>
        function showLove() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>

</html>
