<!DOCTYPE html>
<html>
<head>
    <title>Happy Valentines to my Muflima!!!! ❤️</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-top: 100px;
            font-size: 40px;
        }

        h2 {
            margin-top: 40px;
            font-size: 28px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px;
            position: relative;
        }

        #yesBtn {
            background: white;
            color: #ff4b6e;
        }

        #noBtn {
            background: black;
            color: white;
            position: absolute;
        }

        #thankYou {
            display: none;
            font-size: 30px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <h1>Happy Valentines to my Muflima!!!! ❤️</h1>

    <h2>Will you be my Valentine forever???</h2>

    <button id="yesBtn" class="btn">Yes 💖</button>
    <button id="noBtn" class="btn">NO 😜</button>

    <div id="thankYou">
        💕 Thank You for choosing me in your life!!!!! 💕
    </div>

    <audio id="music" src="romantic.mp3"></audio>

    <script>
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");
        const thankYou = document.getElementById("thankYou");
        const music = document.getElementById("music");

        // Move NO button when mouse touches
        noBtn.addEventListener("mouseover", function() {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });

        // When YES clicked
        yesBtn.addEventListener("click", function() {
            thankYou.style.display = "block";
            music.play();
        });
    </script>

</body>
</html>
