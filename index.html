<!DOCTYPE html>
<html>
<head>
    <title>Happy Valentines to my Muflima!!!! ❤️</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            overflow: hidden;
            transition: background 1s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        h1 {
            margin-top: 100px;
            font-size: 40px;
        }

        h2 {
            margin-top: 40px;
            font-size: 28px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px;
            position: relative;
        }

        #yesBtn {
            background: white;
            color: #ff4b6e;
        }

        #noBtn {
            background: black;
            color: white;
            position: absolute;
        }

        #thankYou {
            display: none;
            font-size: 35px;
            margin-top: 50px;
            text-shadow: 2px 2px 10px black;
        }

        .overlay {
            background: rgba(0,0,0,0.5);
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: none;
        }
    </style>
</head>

<body>

    <h1>Happy Valentines to my Muflima!!!! ❤️</h1>

    <h2>Will you be my Valentine forever???</h2>

    <button id="yesBtn" class="btn">Yes 💖</button>
    <button id="noBtn" class="btn">NO 😜</button>

    <div id="thankYou">
        💕 Thank You for choosing me in your life!!!!! 💕
    </div>

    <audio id="music">
        <source src="Thangame.mp3" type="audio/mpeg">
    </audio>

    <script>
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");
        const thankYou = document.getElementById("thankYou");
        const music = document.getElementById("music");

        // Move NO button randomly
        noBtn.addEventListener("mouseover", function() {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });

        // YES click action
        yesBtn.addEventListener("click", function() {

            // Change background to your photo
            document.body.style.backgroundImage = "url('WhatsApp Image 2025-08-26 at 21.56.13.jpeg')";
            
            // Hide buttons
            yesBtn.style.display = "none";
            noBtn.style.display = "none";

            // Show thank you message
            thankYou.style.display = "block";

            // Play music
            music.play();
        });
    </script>

</body>
</html>
