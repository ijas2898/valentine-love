<!DOCTYPE html>
<html>
<head>
    <title>Happy Valentines to my Muflima!!!! ❤️</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            overflow-x: hidden;
            transition: background 1s ease-in-out;
            min-height: 100vh;
        }

        h1 {
            margin-top: 80px;
            font-size: 32px;
        }

        h2 {
            margin-top: 30px;
            font-size: 22px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 15px;
            position: relative;
        }

        #yesBtn {
            background: white;
            color: #ff4b6e;
        }

        #noBtn {
            background: black;
            color: white;
            position: absolute;
        }

        #thankYou {
            display: none;
            font-size: 26px;
            margin-top: 40px;
            text-shadow: 2px 2px 10px black;
            padding: 20px;
        }

        /* Responsive background class */
        .photo-bg {
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain;
            background-attachment: fixed;
        }

        @media (max-width: 768px) {
            .photo-bg {
                background-size: contain;
                background-position: center top;
            }
        }

        /* Floating Hearts */
        .heart {
            position: fixed;
            bottom: -20px;
            font-size: 20px;
            animation: floatUp linear forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Happy Valentines to my Muflima!!!! ❤️</h1>

    <h2>Will you be my Valentine forever???</h2>

    <button id="yesBtn" class="btn">Yes 💖</button>
    <button id="noBtn" class="btn">NO 😜</button>

    <div id="thankYou">
        💕 Thank You for choosing me in your life!!!!! 💕
    </div>

    <audio id="music">
        <source src="Thangame.mp3" type="audio/mpeg">
    </audio>

    <script>
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");
        const thankYou = document.getElementById("thankYou");
        const music = document.getElementById("music");

        // Move NO button randomly
        noBtn.addEventListener("mouseover", function() {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });

        // YES click action
        yesBtn.addEventListener("click", function() {

            document.body.style.backgroundImage =
                "url('WhatsApp Image 2026-02-12 at 11.21.28.jpeg')";

            document.body.classList.add("photo-bg");

            yesBtn.style.display = "none";
            noBtn.style.display = "none";

            thankYou.style.display = "block";

            music.currentTime = 0;
            music.play().catch(() => {
                alert("Tap screen once and press YES again ❤️");
            });

            startHearts();   // 🔥 Start heart animation
        });

        function startHearts() {
            setInterval(() => {

                const heart = document.createElement("div");
                heart.className = "heart";
                heart.innerHTML = "💖";

                heart.style.left = Math.random() * window.innerWidth + "px";
                heart.style.fontSize = (Math.random() * 20 + 15) + "px";
                heart.style.animationDuration = (Math.random() * 3 + 3) + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 6000);

            }, 300);
        }
    </script>

</body>
</html>
